name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build, test and package
        shell: pwsh
        run: ./release.ps1
      - name: Test updater process handoff and restart
        shell: pwsh
        run: ./tools/test-updater.ps1
      - name: Upload portable and checksums
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MonitorSwitch-windows-x64
          path: |
            release/MonitorSwitch-portable-win-x64.zip
            release/MonitorSwitch.exe
            release/SHA256SUMS.txt
            release/self-test-report.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: MonitorSwitch-windows-x64
          path: release
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="docs/releases/$RELEASE_TAG.md"
          test -f "$NOTES_FILE"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/MonitorSwitch-portable-win-x64.zip release/MonitorSwitch.exe release/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$NOTES_FILE" --latest
          else
            gh release create "$RELEASE_TAG" release/MonitorSwitch-portable-win-x64.zip release/MonitorSwitch.exe release/SHA256SUMS.txt --verify-tag --title "MonitorSwitch $RELEASE_TAG" --notes-file "$NOTES_FILE" --latest
          fi
